server:
  port: 8081
  
spring:
    application:
        name: auth-service
    datasource:
        url: jdbc:postgresql://auth-db:5432/authdb
        username: postgres
        password: postgres
        driver-class-name: org.postgresql.Driver
    jackson:
        time-zone: "Europe/Moscow"
    jpa:
        hibernate:
            ddl-auto: create-drop
        show-sql: true
    kafka:
        bootstrap-servers: kafka:9092
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
            security:
                protocol: PLAINTEXT

jwt:
    key: my-super-secret-test-key-for-jwt
    expiration: 43200000

outbox:
    scheduler:
        send-delay-ms: 1000
        delete-crone: "0 */1 * * * *"
    batch-size: 10
    max-attemt: 5
    attempt-delay-sec: 3600