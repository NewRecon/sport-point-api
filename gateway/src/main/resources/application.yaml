server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
            - id: event-service
              uri: ${EVENT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/events/**
            - id: profile-service
              uri: ${PROFILE_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/profiles/**,/api/v1/files/**
            - id: subscription-service
              uri: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/subscriptions/**

jwt:
  key: ${JWT_KEY:my-super-secret-test-key-for-jwt}