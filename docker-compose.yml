services:
  # ============ PostgreSQL ============
  postgres-auth:
    image: postgres:18.4-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB_AUTH:-authdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-auth-data:/var/lib/postgresql
    networks:
      - sport_point_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_AUTH:-authdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-profile:
    image: postgres:18.4-alpine
    container_name: profile-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB_PROFILE:-profiledb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-profile-data:/var/lib/postgresql
    networks:
      - sport_point_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_PROFILE:-profiledb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-event:
    image: postgres:18.4-alpine
    container_name: event-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB_EVENT:-eventdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-event-data:/var/lib/postgresql
    networks:
      - sport_point_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_EVENT:-eventdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-subscription:
    image: postgres:18.4-alpine
    container_name: subscription-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB_SUBSCRIPTION:-subscriptiondb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-subscription-data:/var/lib/postgresql
    networks:
      - sport_point_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_SUBSCRIPTION:-subscriptiondb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Redis ============
  redis:
    image: redis:8.8.0-alpine
    container_name: redis
    volumes:
      - redis-data:/data
    networks:
      - sport_point_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Kafka ============
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    networks:
      - sport_point_network
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}

  # ============ RustFS (S3) ============
  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: rustfs
    ports:
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
    volumes:
      - rustfs-data:/data
    networks:
      - sport_point_network

  # ============ Микросервисы ============
  auth-service:
    image: sport-point-auth-service:latest
    container_name: auth-service
    depends_on:
      postgres-auth:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/${POSTGRES_DB_AUTH:-authdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      JWT_KEY: ${JWT_KEY:-my-super-secret-test-key-for-jwt}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-43200000}
      OUTBOX_SEND_DELAY_MS: ${OUTBOX_SEND_DELAY_MS:-1000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_MAX_ATTEMPT: ${OUTBOX_MAX_ATTEMPT:-5}
      OUTBOX_ATTEMPT_DELAY_SEC: ${OUTBOX_ATTEMPT_DELAY_SEC:-3600}
      OUTBOX_DELETE_CRON: ${OUTBOX_DELETE_CRON:-0 */1 * * * *}
    networks:
      - sport_point_network

  event-service:
    image: sport-point-event-service:latest
    container_name: event-service
    depends_on:
      postgres-event:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://event-db:5432/${POSTGRES_DB_EVENT:-eventdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      OUTBOX_SEND_DELAY_MS: ${OUTBOX_SEND_DELAY_MS:-1000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_MAX_ATTEMPT: ${OUTBOX_MAX_ATTEMPT:-5}
      OUTBOX_ATTEMPT_DELAY_SEC: ${OUTBOX_ATTEMPT_DELAY_SEC:-3600}
      OUTBOX_DELETE_CRON: ${OUTBOX_DELETE_CRON:-0 */1 * * * *}
      EVENT_DELETE_CRON: ${EVENT_DELETE_CRON:-0 */1 * * * *}
    networks:
      - sport_point_network

  profile-service:
    image: sport-point-profile-service:latest
    container_name: profile-service
    depends_on:
      postgres-profile:
        condition: service_healthy
      kafka:
        condition: service_started
      rustfs:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://profile-db:5432/${POSTGRES_DB_PROFILE:-profiledb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_PUBLIC_ENDPOINT: /s3
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_BUCKET_NAME: ${RUSTFS_BUCKET_NAME:-avatars}
    networks:
      - sport_point_network

  subscription-service:
    image: sport-point-subscription-service:latest
    container_name: subscription-service
    depends_on:
      postgres-subscription:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://subscription-db:5432/${POSTGRES_DB_SUBSCRIPTION:-subscriptiondb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      OUTBOX_SEND_DELAY_MS: ${OUTBOX_SEND_DELAY_MS:-1000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_MAX_ATTEMPT: ${OUTBOX_MAX_ATTEMPT:-5}
      OUTBOX_ATTEMPT_DELAY_SEC: ${OUTBOX_ATTEMPT_DELAY_SEC:-3600}
      OUTBOX_DELETE_CRON: ${OUTBOX_DELETE_CRON:-0 */1 * * * *}
    networks:
      - sport_point_network

  # ============ API Gateway ============
  gateway:
    image: sport-point-gateway:latest
    container_name: gateway
    depends_on:
      - auth-service
      - event-service
      - profile-service
      - subscription-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      EVENT_SERVICE_URL: http://event-service:8082
      PROFILE_SERVICE_URL: http://profile-service:8083
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8084
      JWT_KEY: ${JWT_KEY:-my-super-secret-test-key-for-jwt}
    networks:
      - sport_point_network

  # ============ Nginx (frontend + reverse proxy) ============
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
      - rustfs
    networks:
      - sport_point_network
    restart: unless-stopped

networks:
  sport_point_network:
    driver: bridge

volumes:
  postgres-auth-data:
  postgres-profile-data:
  postgres-event-data:
  postgres-subscription-data:
  redis-data:
  rustfs-data: